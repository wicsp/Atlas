[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas"
version = "0.3.0"
description = "Personal server control plane backend for system status and service probes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115.0",
    "httpx[socks]>=0.27.0",
    "psutil>=6.0.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0",
    "tomli-w>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
atlas-password-hash = "atlas.security:print_password_hash"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
