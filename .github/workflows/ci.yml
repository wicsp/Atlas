name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - name: Sync locked environment
        working-directory: apps/server
        run: uv sync --frozen
      - name: Test
        working-directory: apps/server
        run: uv run --frozen pytest -q
      - name: Lint
        working-directory: apps/server
        run: uv run --frozen ruff check .

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/console
        run: npm ci
      - name: Lint
        working-directory: apps/console
        run: npm run lint
      - name: Build and test
        working-directory: apps/console
        run: npm test
      - name: Audit production dependencies
        working-directory: apps/console
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan checked-out source
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner
